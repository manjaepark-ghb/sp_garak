<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슾가락 뉴스레터 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f2f1ed;min-height:100vh;padding:32px 16px 64px}
.container{max-width:820px;margin:0 auto}

/* HEADER */
.header{background:#0f1117;border-radius:14px;padding:26px 30px 22px;margin-bottom:16px}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{font-size:20px;font-weight:700;color:#fff;font-family:Georgia,serif}
.logo-sub{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.35);text-transform:uppercase}
.header-desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.7}

/* CONFIG */
.config{background:#fff;border:.5px solid #e8e5de;border-radius:12px;padding:20px 22px;margin-bottom:16px}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.field-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#bbb;text-transform:uppercase;display:block;margin-bottom:7px}
select{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid #d8d4cb;font-size:13px;color:#111;background:#faf9f6;font-family:inherit;cursor:pointer;appearance:none}
.gen-btn{width:100%;padding:13px 0;background:#0f1117;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s}
.gen-btn:disabled{background:#ccc;cursor:not-allowed}

/* LOADING */
.loading-wrap{background:#fff;border:.5px solid #e8e5de;border-radius:12px;padding:40px;text-align:center}
.spinner{width:30px;height:30px;border:2px solid #f0ede6;border-top-color:#0f1117;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-step{font-size:13px;color:#888}

/* RESULT BLOCKS */
.result-stack{display:flex;flex-direction:column;gap:14px}
.theme-block{background:#0f1117;border-radius:12px;padding:22px 24px}
.block-label{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:10px}
.theme-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
.theme-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:14px}
.theme-desc{font-size:13px;color:rgba(255,255,255,.7);line-height:1.8}
.season-note{margin-top:14px;background:rgba(245,166,35,.12);border-left:2.5px solid #f5a623;border-radius:0 6px 6px 0;padding:8px 12px;font-size:12px;color:#f5a623;line-height:1.6}

.trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trend-card{background:#fff;border:.5px solid #e8e5de;border-radius:10px;padding:16px 18px}
.trend-num{font-size:10px;font-weight:700;letter-spacing:.1em;color:#bbb;text-transform:uppercase;margin-bottom:6px}
.trend-title{font-size:14px;font-weight:700;color:#111;margin-bottom:8px}
.trend-body{font-size:12px;color:#555;line-height:1.75;margin-bottom:10px}
.trend-hook{background:#fffbf0;border-left:2px solid #f5a623;border-radius:0 4px 4px 0;padding:6px 10px;font-size:11px;color:#7a5500;line-height:1.5}

.insight-block{background:#fff;border:.5px solid #e8e5de;border-radius:12px;padding:20px 24px}
.insight-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#bbb;text-transform:uppercase;margin-bottom:12px}
.insight-text{font-size:13px;color:#333;line-height:1.9;margin-bottom:14px}
.insight-callout{background:#fffbf0;border-left:2.5px solid #f5a623;border-radius:0 6px 6px 0;padding:9px 12px;font-size:12px;color:#7a5500;line-height:1.6}

/* MIX BLOCK */
.mix-block{background:#fff;border:.5px solid #e8e5de;border-radius:12px;overflow:hidden}
.mix-head{padding:16px 22px 12px;border-bottom:.5px solid #f3f0e9}
.mix-head-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#bbb;text-transform:uppercase;margin-bottom:4px}
.mix-reason{font-size:12px;color:#777;line-height:1.6}

/* PKG TABS */
.mix-tabs{display:flex;border-bottom:.5px solid #f3f0e9;overflow-x:auto}
.mix-tab{padding:10px 18px;font-size:12px;font-weight:700;color:#bbb;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none}
.mix-tab.active{color:#0f1117;border-bottom:2px solid #0f1117}

.mix-panels{padding:14px 16px 16px}
.mix-panel{display:none}
.mix-panel.active{display:block}

/* MEDIA TYPE GROUP */
.media-type-group{margin-bottom:16px}
.media-type-title{font-size:10px;font-weight:700;letter-spacing:.1em;color:#aaa;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;border-bottom:.5px solid #f3f0e9}
.pkg-cards{display:flex;flex-direction:column;gap:8px}

.pkg-card{border:.5px solid #e8e5de;border-radius:10px;padding:14px 16px;background:#fff;position:relative;transition:border-color .15s}
.pkg-card.rec{border:1.5px solid #0f1117;background:#faf9f6}
.priority-badge{position:absolute;top:12px;right:12px;font-size:10px;background:#0f1117;color:#fff;padding:2px 8px;border-radius:20px;font-weight:700}
.pkg-sub{font-size:10px;font-weight:700;letter-spacing:.08em;color:#bbb;text-transform:uppercase;margin-bottom:4px}
.pkg-name{font-size:13px;font-weight:700;color:#111;margin-bottom:6px}
.pkg-desc{font-size:12px;color:#666;line-height:1.6;margin-bottom:10px}
.pkg-stats{display:flex;gap:6px;flex-wrap:wrap}
.stat-pill{background:#f3f0e9;border-radius:6px;padding:4px 9px}
.stat-lbl{font-size:9px;color:#aaa;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.stat-val{font-size:11px;font-weight:700;color:#333;margin-top:1px}
.pkg-add{margin-top:8px;font-size:11px;color:#999}
.pkg-add span{color:#555;font-weight:500}

.mix-tip{margin:0 0 4px;background:#f9f8f5;border:.5px solid #e8e5de;border-radius:8px;padding:10px 14px;font-size:12px;color:#555}
.copy-btn{width:100%;padding:13px 0;background:#f3f0e9;color:#333;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:4px}
.copy-btn.done{background:#1a8c4e;color:#fff}
.error-msg{margin-top:10px;font-size:12px;color:#c0392b;display:none}
</style>
</head>

async function callClaude(prompt){
  // Vercel 서버 함수를 통해 API 키를 안전하게 사용
  const res = await fetch("/api/generate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ prompt: prompt })
  });
  if(!res.ok){
    const errBody = await res.text();
    throw new Error("서버 오류 " + res.status + ": " + errBody.slice(0,200));
  }
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  if(!data.text) throw new Error("응답이 비어 있습니다.");
  return data.text;
}

function extractJSON(raw){
  // 1) ```json 블록
  let m = raw.match(/```json\s*([\s\S]*?)```/);
  if(m) return m[1].trim();
  // 2) ``` 블록
  m = raw.match(/```\s*([\s\S]*?)```/);
  if(m) return m[1].trim();
  // 3) { ... } 가장 바깥 추출
  const start = raw.indexOf('{');
  const end = raw.lastIndexOf('}');
  if(start !== -1 && end > start) return raw.slice(start, end + 1);
  return raw.trim();
}

function safeParseJSON(raw){
  // 1차: 그대로 파싱
  try { return JSON.parse(raw); } catch(e1){}
  // 2차: 문자열 값 안의 리터럴 줄바꿈을 \n 이스케이프로 치환
  try {
    var fixed = raw.replace(/"((?:[^"\\]|\\.)*)"/g, function(match, inner){
      return '"' + inner.replace(/\r\n/g,'\\n').replace(/\n/g,'\\n').replace(/\r/g,'\\n').replace(/\t/g,'\\t') + '"';
    });
    return JSON.parse(fixed);
  } catch(e2){}
  // 3차: 모든 제어문자를 공백으로 치환
  try {
    var fixed2 = raw.replace(/[\x00-\x09\x0B\x0C\x0E-\x1F\x7F]/g,' ').replace(/\r?\n/g,' ');
    return JSON.parse(fixed2);
  } catch(e3){}
  // 4차: 전체 줄바꿈 제거 후 파싱
  try { return JSON.parse(raw.replace(/[\r\n]+/g,' ')); } catch(e4){}
  return null;
}

function switchTab(btn, panelId){
  document.querySelectorAll('.mix-tab').forEach(b=>b.classList.remove('active'));

}

function copyText(){
  if(!lastResult) return;
  const {trend, map, industry} = lastResult;
  const recOffice = (map.office||[]).slice(0,3).join(' / ');
  const recLiving = (map.living||[]).join(' / ') || '해당 없음';
  const text=`[슾가락 뉴스레터 인사이트 초안 — ${industry}]\n\n■ 테마: ${trend.mainTheme}\n${trend.themeDesc}\n\n■ 시즈널 포인트\n${trend.seasonality||'-'}\n\n■ 인사이트\n${trend.newsletterInsight}\n${trend.callout}\n\n■ 추천 미디어 믹스\n프라임오피스: ${recOffice}\n프라임리빙: ${recLiving}\n\n추천 이유: ${map.reason}`;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copyBtn');
    btn.textContent='✓ 클립보드에 복사됨';
    btn.classList.add('done');
    setTimeout(()=>{btn.textContent='초안 텍스트 복사하기 →';btn.classList.remove('done');},2000);
  });
}
